# netlify.toml — Netlify 部署设定
# 把这个文件放在专案根目录，Netlify 连接 Git 仓库后会自动读取这份设定，
# 不需要在网页后台手动填任何 build 设定。

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA 路由：所有找不到的路径都导回 index.html，避免刷新页面出现404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
